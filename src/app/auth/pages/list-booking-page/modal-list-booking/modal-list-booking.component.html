@if(showModal) {
<div class="fixed inset-0 backdrop-blur-sm bg-white/30 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 shadow-2xl max-w-md w-full">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-red-600">¿Eliminar reservación?</h3>
      <button (click)="onCancel()" class="text-gray-500 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="mb-4">
      <p class="text-gray-700">¿Estás seguro de que deseas eliminar esta reservación? Esta acción no se puede deshacer.</p>
    </div>
    <div class="flex justify-end gap-3">
      <button (click)="onCancel()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">
        Cancelar
      </button>
      <button (click)="onConfirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
        Eliminar
      </button>
    </div>
  </div>
</div>
}
