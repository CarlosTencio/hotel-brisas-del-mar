<div class="max-w-md mx-auto p-4 bg-white shadow-md rounded-lg space-y-4">
  <h2 class="text-xl font-semibold text-gray-700">Disponibilidad de habitaciones</h2>

  <div class="flex flex-col">
    <label class="mb-1 text-sm font-medium text-gray-600">Fecha de entrada</label>
    <input type="date" class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-blue-300" />
  </div>

  <div class="flex flex-col">
    <label class="mb-1 text-sm font-medium text-gray-600">Fecha de salida</label>
    <input type="date" class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-blue-300" />
  </div>

  <div class="flex flex-col">
    <label class="mb-1 text-sm font-medium text-gray-600">Tipo de habitación</label>
    <select class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-blue-300">
      <option value="">Cualquiera</option>
      <option value="1">Normal</option>
      <option value="2">Premium</option>
    </select>
  </div>

  <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">Buscar</button>
</div>
