<div class="mt-4">
    <div class="mb-4 flex justify-end">
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2" (click)="onAddNewFacility()">
            <i class="fas fa-plus"></i>
            Agregar Facilidad
        </button>
    </div>
    
    @for (item of dataPage(); track $index) {
        @if (item.pageTitle === 'Facilidades') {
            <facility-item [dataPage]="item" (showModalRequest)="onShowModalRequest($event)" />
            <hr class="mb-2.5">
        }
    }
</div>

@if (showAddFacilityModal()) {
   <div class="fixed inset-0 bg-black bg-opacity-20 flex items-center justify-center z-50 p-4 transition-all duration-200 ease-out">
    <div class="bg-white rounded-lg w-full max-w-sm sm:max-w-2xl md:max-w-4xl lg:max-w-6xl max-h-[90vh] overflow-y-auto shadow-2xl transform transition-all duration-200 ease-out scale-100">
        <!-- Header -->
        <div class="p-4 sm:p-6 border-b border-gray-200">
            <h2 class="text-lg sm:text-xl font-semibold text-gray-900">Agregar Nueva Facilidad</h2>
        </div>
        
        <!-- Content -->
        <div class="p-4 sm:p-6">
            <div class="flex flex-col lg:grid lg:grid-cols-12 gap-4 lg:gap-6">
                <!-- Image Section -->
                <div class="lg:col-span-3 order-1 lg:order-1">
                    <label class="block text-sm font-medium text-gray-700 mb-2 lg:hidden">Imagen</label>
                    <div class="relative group cursor-pointer rounded-lg overflow-hidden">
                        <img [src]="'https://via.placeholder.com/300x200'" 
                             alt="Facility Image"
                             class="w-full h-32 sm:h-40 lg:h-48 object-cover rounded-lg shadow-md transition-all duration-300 group-hover:brightness-50" />
                        
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-lg">
                            <label class="bg-white bg-opacity-90 hover:bg-opacity-100 px-2 py-1 sm:px-3 sm:py-2 rounded-lg shadow-lg cursor-pointer transition-all duration-200 transform hover:scale-105">
                                <div class="flex flex-col items-center space-y-1">
                                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    <span class="text-xs font-medium text-gray-700">Cambiar</span>
                                </div>
                                <input type="file"
                                       accept="image/jpeg,image/png,image/gif,image/webp"
                                       class="hidden" />
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Content Section -->
                <div class="lg:col-span-7 order-3 lg:order-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contenido de la facilidad</label>
                    <textarea rows="4" 
                              class="w-full p-3 border border-gray-300 rounded-lg shadow-sm resize-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm sm:text-base"
                              placeholder="Describe la facilidad..."></textarea>
                </div>
                
                <!-- Buttons Section -->
                <div class="lg:col-span-2 order-2 lg:order-3">
                    <div class="flex flex-row lg:flex-col gap-3">
                        <button (click)="onSaveFacility()" 
                                class="flex-1 lg:w-full bg-blue-500 text-white px-4 py-2 sm:py-3 rounded-lg hover:bg-blue-600 transition-colors font-medium text-sm">
                            Guardar
                        </button>
                        <button (click)="onCloseModal()" 
                                class="flex-1 lg:w-full bg-red-500 text-white px-4 py-2 sm:py-3 rounded-lg hover:bg-red-600 transition-colors font-medium text-sm">
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
}
