@if (!dataPage()) {
  <h1>No hay facilidades para editar</h1>
}

<div class="w-full max-w-7xl mx-auto p-6">
  <div class="grid grid-cols-12 gap-6 items-start">
    
    <label for="" >{{idFacility()}}</label>
    <div class="col-span-2">
      <div class="relative group cursor-pointer rounded-lg overflow-hidden">
        <img [src]="image()" alt="Facility Image" 
             class="w-full h-48 object-cover rounded-lg shadow-md transition-all duration-300 group-hover:brightness-50" />
        
       
        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-lg pointer-events-none group-hover:pointer-events-auto">
          
          <label class="bg-white bg-opacity-90 hover:bg-opacity-100 px-3 py-2 rounded-lg shadow-lg cursor-pointer transition-all duration-200 transform hover:scale-105">
            <div class="flex flex-col items-center space-y-1">
              
              <!-- Icono de cámara más simple -->
              <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              
              <span class="text-xs font-medium text-gray-700">Cambiar</span>
            </div>
            
            <!-- Input file oculto -->
            <!-- (change)="onFileSelected($event)" -->
            <input
              formControlName="img"
              type="file"
             
              accept="image/jpeg,image/png,image/gif,image/webp"
              class="hidden"
            />
          </label>
          
        </div>
      </div>
    </div>
    
    <div class="col-span-8">
      <label class="block text-sm font-medium text-gray-700 mb-2">Contenido de la facilidad</label>
      <textarea rows="6" 
                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm resize-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">{{ content() }}</textarea>
    </div>
    
    <div class="col-span-2 flex flex-col space-y-3">
      <button class="w-full bg-blue-500 text-white px-4 py-3 rounded-lg hover:bg-blue-600 transition-colors font-medium text-sm">
        Actualizar
      </button>
     
      <button (click)="deleteFacility(idFacility())" class="w-full bg-red-500 text-white px-4 py-3 rounded-lg hover:bg-red-600 transition-colors font-medium text-sm">
        Eliminar
      </button>

    </div>
    
  </div>
  
</div>
