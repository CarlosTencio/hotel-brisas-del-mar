<div class="contactus-edit-container" [formGroup]="contactForm">
  <h2>Editar Información de Contacto</h2>

  <form (ngSubmit)="handleUpdateContent()">

    <div class="form-group">
      <label for="phone1">Teléfono 1: </label>
      <input id="phone1" type="text" formControlName="phone1" />
    </div>

    <div class="form-group">
      <label for="phone2">Teléfono 2: </label>
      <input id="phone2" type="text" formControlName="phone2" />
    </div>

    <div class="form-group">
      <label for="poBox">Apartado Postal: </label>
      <input id="poBox" type="text" formControlName="poBox" />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico: </label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div class="form-group">
      <label for="facebook">Facebook: </label>
      <input id="facebook" type="text" formControlName="facebook" />
    </div>

    <div class="form-group">
      <label for="instagram">Instagram: </label>
      <input id="instagram" type="text" formControlName="instagram" />
    </div>

    <div class="form-group">
      <div class="lg:col-span-2 order-2 lg:order-3">
        <div class="flex flex-row lg:flex-col gap-3">
          <button type="button" (click)="handleUpdateContent()"
              class="flex-1 lg:w-full bg-blue-500 text-white px-4 py-2 sm:py-3 rounded-lg hover:bg-blue-600 transition-colors font-medium text-sm disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="contactForm.invalid">
              Actualizar
          </button>
          <button type="button" (click)="onCloseModal()"
              class="flex-1 lg:w-full bg-red-500 text-white px-4 py-2 sm:py-3 rounded-lg hover:bg-red-600 transition-colors font-medium text-sm">
              Cancelar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
