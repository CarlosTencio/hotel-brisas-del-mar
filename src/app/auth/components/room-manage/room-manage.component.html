<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6">Modificar Habitación</h1>

  <div class="mb-6">
    <label for="roomTypeSelect" class="block text-lg font-semibold text-gray-700 mb-2">
        Selecciona tipo de habitación:
    </label>
    <select
        id="roomTypeSelect"
        class="w-full p-2 border rounded-lg shadow"
        [(ngModel)]="selectedRoomType"
        (change)="loadRoomData()"
        name="roomTypeSelect"
    >
        <option value="">-- Selecciona --</option>
        <option value="Normal">Normal</option>
        <option value="Premium">Premium</option>
    </select>
  </div>


  <div>
    <label>Tipo: </label> <span>{{ room.roomTypeName }}</span>
    <label class="ml-8">Tarifa Diaria: </label>
    <input [(ngModel)]="room.price" type="text" class="input-text" />
  </div>

  <div class="mt-4">
    <label class="block font-semibold text-gray-700 mb-1">Características:</label>
    <textarea
      [(ngModel)]="room.characteristics"
      rows="3"
      class="w-full p-2 border rounded-lg shadow-sm resize-none"
    ></textarea>
  </div>

  <div class="mt-4">
    <label class="block font-semibold text-gray-700 mb-1">Descripción:</label>
    <textarea
      [(ngModel)]="room.description"
      rows="3"
      class="w-full p-2 border rounded-lg shadow-sm resize-none"
    ></textarea>
  </div>

  <div class="mt-4">
    <label class="block text-gray-700 font-semibold mb-1">Imagen actual</label>
    <img
      [src]="room.image"
      alt="Imagen actual"
      class="image-preview"
    />
  </div>

  <div class="mt-4">
    <label class="block text-gray-700 font-semibold mb-1">Subir nueva imagen:</label>
    <input
      type="file"
      (change)="onFileSelected($event)"
      class="file-input"
    />
  </div>

  <div class="mt-6 flex gap-4">
    <button (click)="onSubmit()" class="btn-accept">Aceptar</button>
    <button (click)="onDelete()" class="btn-cancel">Cancelar</button>
  </div>
</div>
