
<section class="w-full py-4 overflow-y-auto h-full">
  @for (option of menuOptions; track option.route) {
    <a 
      [routerLink]="option.route" 
      routerLinkActive="bg-gray-200 text-slate-900 border-l-4 border-green-600" 
      class="w-full block px-4 py-3 text-gray-700 hover:bg-gray-100 transition-all duration-200 border-l-4 border-transparent"
    >
      <span class="text-base">{{option.label}}</span>
    </a>
  }
</section>
