<div class="bg-slate-100 min-h-screen flex flex-col antialiased text-slate-800 overflow-hidden">
  <!-- Header (si tienes uno) -->
  <header class="flex flex-wrap items-center p-4 bg-white shadow-md w-full">
    <div class="flex items-center w-full">
      <button 
        (click)="toggleMenu()" 
        class="md:hidden p-2 rounded-md text-gray-700 hover:bg-gray-200 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    
      <img src="assets/logo.png" alt="Logo" class="h-12 w-auto ml-2" />
      
      
      <div class="flex flex-col ml-4">
        <h1 class="font-bold text-lg">Hotel Brisas del Mar</h1>
        <h2 class="text-gray-500 text-sm">Modulo Administrativo</h2>
      </div>
    </div>
    
  </header>

  <div class="flex flex-1 relative">
    <!-- Menú lateral - se oculta en móvil -->
    <nav 
      [class.translate-x-0]="menuOpen" 
      [class.-translate-x-full]="!menuOpen"
      class="bg-white w-64 shadow-lg fixed md:static md:translate-x-0 h-full z-20 transition-transform duration-300 ease-in-out"
    >
      <app-side-menu-options-auth />
    </nav>


    @if(menuOpen) {
      <div  
      (click)="toggleMenu()" 
      class="fixed inset-0  z-10 md:hidden"
    ></div>
    }
   
  </div>
</div>
