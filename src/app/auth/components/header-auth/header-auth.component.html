<header class="flex flex-wrap justify-between items-center p-4 bg-white shadow-md">
  <div class="flex items-center">
    <button
      (click)="toggleMenu()"
      class="md:hidden p-2 rounded-md text-gray-700 hover:bg-gray-100 focus:outline-none mr-2"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <img src="assets/logo.png" alt="Logo" class="h-10 w-auto" />
    <div class="flex flex-col ml-2">
      <h1 class="font-bold text-sm md:text-lg text-gray-800">Hotel Brisas del Mar</h1>
      <h2 class="text-gray-500 text-xs md:text-sm">Modulo Administrativo</h2>
    </div>
  </div>

  <div class="flex flex-col md:flex-row items-end md:items-center space-y-2 md:space-y-0 md:space-x-4">
    <div class="flex items-center space-x-1">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4 text-gray-400 md:h-5 md:w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      <span class="font-semibold text-gray-700 text-xs md:text-sm">Bienvenido: {{ userName || 'Admin' }}</span>
    </div>

    <button
      (click)="logout()"
      class="flex items-center px-2 py-1 md:px-4 md:py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 md:h-5 md:w-5 md:mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="text-xs md:text-sm">Salir</span>
    </button>
  </div>
</header>
