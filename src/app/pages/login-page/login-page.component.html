<div class="min-h-screen flex flex-col bg-gray-100">
  <div class="flex-grow flex items-start justify-center pt-20 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6">
      <div>
        <app-login (loginEvent)="handleLogin($event)"></app-login>
      </div>
    </div>
  </div>

  @if(showErrorModal()){
    
      <app-modal-login [errorMessage]="errorMessage()" (closeModal)="closeErrorModal()"></app-modal-login>
    
    
  }
</div>
