<form class="mt-6 space-y-4" (ngSubmit)="onSubmit()" #loginForm="ngForm">
  <h2 class="text-center text-2xl font-semibold text-gray-900">
    Iniciar Sesión
  </h2>
  <div class="space-y-4">
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
      <input id="username" name="username" type="text" required [(ngModel)]="username"
        placeholder="Ingrese su usuario"
        class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>
      
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
      <input id="password" name="password" type="password" required [(ngModel)]="password"
        placeholder="Ingrese su contraseña"
        class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>
      
    <button type="submit"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
      Iniciar Sesión
    </button>
    </div>
  </form>
