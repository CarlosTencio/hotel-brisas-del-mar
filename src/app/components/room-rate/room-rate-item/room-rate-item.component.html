<div class="flex flex-col lg:flex-row items-start">

    <div class="flex lg:justify-start w-full px-0">

        <img [src]="image()" alt="Imagen de la habitación"
            class="w-40 h-40 rounded-xl object-cover shadow-lg animate-fade-in" />

        <div class="text-left ml-5">

            <p class="text-2xl font-bold mb-2 text-left">
                {{ roomTypeName() }}
            </p>

            <div class="mb-4">
                <p [innerText]="description()" class="text-gray-700"></p>
            </div>

            <div class="mb-4">
                <ul class="list-disc list-inside text-gray-700 mt-2 space-y-1">
                    @for (item of characteristics().split(tokenSplit); track $index) {
                    <li>
                        {{ item.trim() }}
                    </li>
                    }
                </ul>
            </div>

            <div class="mb-4">
                <h2 class="text-xl font-semibold text-emerald-700">Precio</h2>
                <p class="text-gray-700">₡{{ price() }}</p>
            </div>

        </div>
    </div>

</div>
